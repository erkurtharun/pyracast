{% load i18n %}{% get_current_language as language %}<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ mail_title }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f9f8f3;color:#172b36;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;">
  <div aria-hidden="true" style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{% block preheader %}{% endblock %}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background-color:#f9f8f3;">
    <tr><td align="center" style="padding:20px 12px;">
      <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;border-collapse:collapse;background-color:#ffffff;border:1px solid #dce3e8;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;">
        <tr><td style="padding:18px 24px;border-bottom:1px solid #dce3e8;color:#09383a;font-size:16px;font-weight:bold;">Pyracast</td></tr>
        <tr><td style="padding:24px;overflow-wrap:anywhere;word-wrap:break-word;">{% block content %}{% endblock %}</td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
