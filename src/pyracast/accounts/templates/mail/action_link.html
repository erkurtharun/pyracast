{% load i18n %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0;border-collapse:collapse;">
  <tr><td bgcolor="#0b5f62" style="border-radius:4px;text-align:center;">
    <a href="{{ action_url }}" style="display:inline-block;border:12px solid #0b5f62;border-left-width:20px;border-right-width:20px;border-radius:4px;color:#ffffff;font-size:16px;font-weight:bold;text-decoration:none;">{{ action_label }}</a>
  </td></tr>
</table>
<p style="margin:0 0 6px;color:#526370;font-size:13px;">{% translate "Or copy this link into your browser:" %}</p>
<p style="margin:0;font-size:13px;word-break:break-all;"><a href="{{ action_url }}" style="color:#0b5f62;text-decoration:underline;">{{ action_url }}</a></p>
