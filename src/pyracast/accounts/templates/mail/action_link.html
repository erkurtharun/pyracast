{% load i18n %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;border-collapse:collapse;">
  <tr><td class="mail-button" bgcolor="#09383a" style="mso-padding-alt:12px 22px;border-radius:4px;background-color:#09383a;text-align:center;">
    <a href="{{ action_url }}" style="display:block;padding:12px 22px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:20px;font-weight:bold;color:#ffffff;text-decoration:none;">{{ action_label }}</a>
  </td></tr>
</table>
<p class="mail-muted" style="margin:0 0 6px;font-family:Arial,Helvetica,sans-serif;color:#526370;font-size:13px;">{% translate "Or copy this link into your browser:" %}</p>
<p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;word-break:break-all;"><a href="{{ action_url }}" style="color:#09383a;text-decoration:underline;">{{ action_url }}</a></p>
