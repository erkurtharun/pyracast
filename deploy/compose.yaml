name: pyracast

x-process: &process
  image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the verified digest}
  init: true
  # Host startup must honor the migration block before starting application processes.
  restart: on-failure:5
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  env_file:
    - path: ${RUNTIME_ENV_FILE:-/run/pyracast/runtime.env}
      format: raw
  environment: &application-environment
    DJANGO_SETTINGS_MODULE: pyracast.production
    PYRACAST_DEBUG: "0"
    PYRACAST_HOSTS: ${SITE_ADDRESS},localhost,127.0.0.1
    PYRACAST_PUBLIC_ORIGIN: https://${SITE_ADDRESS}
    PYRACAST_CSRF_ORIGINS: https://${SITE_ADDRESS}
    PYRACAST_TRUST_PROXY: "1"
    PYRACAST_TRUSTED_PROXY_CIDRS: 172.30.80.2/32
    PGHOST: sqlproxy
    PGPORT: "5432"
    PGDATABASE: pyracast
  networks: [application]
  depends_on:
    sqlproxy: {condition: service_started}
  logging: &logs
    driver: gcplogs
    options:
      mode: non-blocking
      max-buffer-size: 4m
      cache-max-size: 10m
      cache-max-file: "5"

services:
  gateway:
    image: ${GATEWAY_IMAGE:?Set GATEWAY_IMAGE to the verified digest}
    restart: on-failure:5
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls: {net.ipv4.ip_unprivileged_port_start: "0"}
    ports: ["${HTTP_BIND:-0.0.0.0:80}:80", "${HTTPS_BIND:-0.0.0.0:443}:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set the public DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set a certificate contact email}
    volumes:
      - ${CADDY_CONFIG_FILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./routes.caddy:/etc/caddy/routes.caddy:ro
      - ${DATA_ROOT:-/var/lib/pyracast}/caddy:/data
    tmpfs: ["/config:uid=10001,gid=10001,mode=0700,size=16m", "/tmp:size=16m"]
    networks:
      application: {ipv4_address: 172.30.80.2}
    mem_limit: 128m
    pids_limit: 100
    logging: *logs
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}

  api:
    <<: *process
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 100
    stop_grace_period: 100s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=8).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the verified digest}
    init: true
    restart: on-failure:5
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m", "/app/.next/cache:uid=1000,gid=1000,size=64m"]
    environment: {NODE_ENV: production, NEXT_TELEMETRY_DISABLED: "1"}
    networks: [application]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logs

  worker:
    <<: *process
    command: [pyracast, worker, --threads, "2", --queues, default, calibration, epias]
    stop_grace_period: 660s
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 100
    depends_on:
      sqlproxy: {condition: service_started}
      rabbitmq: {condition: service_healthy}

  notifications:
    <<: *process
    command: [pyracast, worker, --threads, "2", --queues, notifications]
    stop_grace_period: 660s
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 100
    depends_on:
      sqlproxy: {condition: service_started}
      rabbitmq: {condition: service_healthy}

  dispatcher:
    <<: *process
    command: [pyracast, dispatch, --loop, --poll-seconds, "30"]
    stop_grace_period: 660s
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 100
    depends_on:
      sqlproxy: {condition: service_started}
      rabbitmq: {condition: service_healthy}

  migrate:
    <<: *process
    profiles: [release]
    restart: "no"
    command: [pyracast, migrate, --noinput]
    env_file:
      - path: ${RUNTIME_ENV_FILE:-/run/pyracast/runtime.env}
        format: raw
      - path: ${MIGRATION_ENV_FILE:-/run/pyracast/migration.env}
        format: raw
        required: false
    mem_limit: 512m
    pids_limit: 100

  sqlproxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.28.0@sha256:e0cbea7b63455c1635d354ef456696d019dd02a5db47bf1994e849823e71ae89
    restart: unless-stopped
    command: [--private-ip, --address=0.0.0.0, --port=5432, --structured-logs, "${CLOUD_SQL_CONNECTION_NAME:?Set Cloud SQL connection name}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 100
    networks:
      application: {ipv4_address: 172.30.80.3}
    logging: *logs

  rabbitmq:
    image: rabbitmq:4.4.0@sha256:1166559c9e77b0208b9d96bfaf265ddbdd491ce3cebb8cf990aabe9274f16d2c
    hostname: rabbitmq
    user: "999:999"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ${BROKER_ENV_FILE:-/run/pyracast/broker.env}
        format: raw
    volumes:
      - ${DATA_ROOT:-/var/lib/pyracast}/rabbitmq:/var/lib/rabbitmq
    tmpfs: ["/tmp:uid=999,gid=999,mode=0700,size=32m"]
    networks: [application]
    mem_limit: 512m
    pids_limit: 200
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging: *logs

networks:
  application:
    ipam:
      config: [{subnet: 172.30.80.0/24, ip_range: 172.30.80.128/25}]
