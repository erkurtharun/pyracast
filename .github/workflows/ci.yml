name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    name: Deployment configuration and containers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      # A release build keeps its images, imports no shared build cache and alone writes it.
      RELEASE_BUILD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # The output of: python3 deploy/release_scope.py sparse-patterns
          sparse-checkout: |
            /*
            !/docs/
            !/tests/
            !/scripts/
            !/web/tests/
            !/web/integration/
            !/web/production-tests/
            !/.agents/
            !/AGENTS.md
            !/CLAUDE.md
            !/.claude/settings.json
            !/.codex/hooks.json
            !/.github/dependabot.yml
            !/qodana.yaml
            !/qodana-js.yaml
            !/sonar-project.properties
            !/.gitignore
            !/web/.gitignore
            !/web/.prettierignore
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9
          enable-cache: false
      - name: Validate GitHub workflows and deployment scripts
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -c 'actionlint -color && shellcheck deploy/*.sh'
      - name: Verify release failure recovery without cloud access
        run: >-
          docker run --rm --network none --cap-drop ALL --entrypoint bash
          -v "$PWD/deploy:/source:ro"
          python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
          /source/test-release.sh
      - name: Verify the boot script on a stubbed host without cloud access
        run: >-
          docker run --rm --network none --entrypoint bash
          -v "$PWD/deploy:/source:ro" -v "$PWD/infra/terraform/templates:/templates:ro"
          python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
          /source/test-boot.sh
      - name: Verify the systemd units a release installs
        run: systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Validate Terraform without cloud credentials or backend access
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - run: mkdir -p "$RUNNER_TEMP/release-images"
      - name: Build the production backend without cloud credentials
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: pyracast-backend:ci
          outputs: type=oci,dest=${{ runner.temp }}/release-images/backend.oci.tar
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: ${{ env.RELEASE_BUILD != 'true' && 'type=gha,scope=backend-linux-amd64,timeout=2m' || '' }}
          cache-to: ${{ env.RELEASE_BUILD == 'true' && 'type=gha,scope=backend-linux-amd64,mode=max,ignore-error=true,timeout=2m' || '' }}
      - name: Build the production web without cloud credentials
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          tags: pyracast-web:ci
          outputs: type=oci,dest=${{ runner.temp }}/release-images/web.oci.tar
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: ${{ env.RELEASE_BUILD != 'true' && 'type=gha,scope=web-linux-amd64,timeout=2m' || '' }}
          cache-to: ${{ env.RELEASE_BUILD == 'true' && 'type=gha,scope=web-linux-amd64,mode=max,ignore-error=true,timeout=2m' || '' }}
      - name: Build the production gateway
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/gateway
          platforms: linux/amd64
          tags: pyracast-gateway:ci
          outputs: type=oci,dest=${{ runner.temp }}/release-images/gateway.oci.tar
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: ${{ env.RELEASE_BUILD != 'true' && 'type=gha,scope=gateway-linux-amd64,timeout=2m' || '' }}
          cache-to: ${{ env.RELEASE_BUILD == 'true' && 'type=gha,scope=gateway-linux-amd64,mode=max,ignore-error=true,timeout=2m' || '' }}
      - name: Build the production PostgreSQL image
        id: postgres
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          platforms: linux/amd64
          tags: pyracast-postgres:ci
          outputs: type=oci,dest=${{ runner.temp }}/release-images/postgres.oci.tar
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: ${{ env.RELEASE_BUILD != 'true' && 'type=gha,scope=postgres-linux-amd64,timeout=2m' || '' }}
          cache-to: ${{ env.RELEASE_BUILD == 'true' && 'type=gha,scope=postgres-linux-amd64,mode=max,ignore-error=true,timeout=2m' || '' }}
      - name: Build the production RabbitMQ image
        id: rabbitmq
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/rabbitmq
          platforms: linux/amd64
          tags: pyracast-rabbitmq:ci
          outputs: type=oci,dest=${{ runner.temp }}/release-images/rabbitmq.oci.tar
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: ${{ env.RELEASE_BUILD != 'true' && 'type=gha,scope=rabbitmq-linux-amd64,timeout=2m' || '' }}
          cache-to: ${{ env.RELEASE_BUILD == 'true' && 'type=gha,scope=rabbitmq-linux-amd64,mode=max,ignore-error=true,timeout=2m' || '' }}
      - name: Bind the image archives to this exact CI run
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
          RABBITMQ_DIGEST: ${{ steps.rabbitmq.outputs.digest }}
        run: |
          for image in backend web gateway postgres rabbitmq; do
            variable="${image^^}_DIGEST"
            printf '%s\n' "${!variable}" > "$RUNNER_TEMP/release-images/$image.digest"
          done
          uv run --no-project --python 3.15.2 python deploy/ci_images.py prepare "$RUNNER_TEMP/release-images" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          bash deploy/oci-images.sh load "$RUNNER_TEMP/release-images" "$GITHUB_SHA"
      - name: Scan every image; block every high or critical vulnerability
        run: |
          POSTGRES_IMAGE=$(docker image inspect pyracast-postgres:ci --format '{{.Id}}')
          RABBITMQ_IMAGE=$(docker image inspect pyracast-rabbitmq:ci --format '{{.Id}}')
          [[ "$POSTGRES_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RABBITMQ_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "POSTGRES_IMAGE=$POSTGRES_IMAGE" >> "$GITHUB_ENV"
          echo "RABBITMQ_IMAGE=$RABBITMQ_IMAGE" >> "$GITHUB_ENV"
          bash deploy/scan-images.sh pyracast-backend:ci pyracast-web:ci pyracast-gateway:ci "$POSTGRES_IMAGE" "$RABBITMQ_IMAGE"
      - name: Exercise the production images and Compose boundary
        run: bash deploy/smoke.sh pyracast-backend:ci pyracast-web:ci pyracast-gateway:ci "$POSTGRES_IMAGE" "$RABBITMQ_IMAGE"
      - name: Move queued work to the built broker and back to the previous public broker
        run: bash deploy/test-broker-rollback.sh pyracast-backend:ci "$RABBITMQ_IMAGE"
      - name: Retain tested main images for the release
        if: env.RELEASE_BUILD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-images/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  verify_ubuntu:
    name: Verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      coverage: ${{ steps.coverage.outputs.artifact-id }}
    env:
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: pyracast
      PGDATABASE: pyracast
      PYRACAST_SECRET_KEY: ci-only-key-not-for-deployment
      PYTEST_XDIST_AUTO_NUM_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9
          enable-cache: true
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-sync --no-build python -m scripts.start_postgres --ephemeral --non-durable
      - name: Start RabbitMQ
        run: |
          RABBITMQ_DEFAULT_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::${RABBITMQ_DEFAULT_PASS}"
          export RABBITMQ_DEFAULT_PASS
          docker run -d --name pyracast-rabbitmq -p 127.0.0.1:5672:5672 -e RABBITMQ_DEFAULT_USER=pyracast -e RABBITMQ_DEFAULT_PASS rabbitmq:4.4.1@sha256:183272aa2ff82718cabeef343de8d9a900931ea65fda4e563fed2a6d9efde578
          for _ in $(seq 1 90); do
            if docker exec --user rabbitmq pyracast-rabbitmq rabbitmq-diagnostics -q check_running; then
              echo 'PYRACAST_LIVE_QUEUE=1' >> "$GITHUB_ENV"
              echo "PYRACAST_RABBITMQ_URL=amqp://pyracast:${RABBITMQ_DEFAULT_PASS}@127.0.0.1:5672/%2F" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs pyracast-rabbitmq
          exit 1
      - run: uv run --locked --no-sync --no-build pyracast migrate --noinput
      - run: uv run --locked --no-sync --no-build pyracast migrate --check
      - run: uv run --locked --no-sync --no-build pyracast check
      - name: Report test worker allocation
        run: >-
          uv run --locked --no-sync --no-build python -c
          "import os, psutil; print({'xdist_workers': os.environ['PYTEST_XDIST_AUTO_NUM_WORKERS'], 'physical_cpus': psutil.cpu_count(logical=False), 'logical_cpus': psutil.cpu_count()})"
      - name: Run all quality checks and record test timings
        env:
          PYTEST_ADDOPTS: --junitxml=test-results/pytest.xml --durations=25
        run: uv run --locked --no-sync --no-build python scripts/check.py
      - name: Upload test timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-results-${{ github.run_attempt }}
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 7
      - run: uv build --no-sources
      - name: Check wheel in an isolated environment
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import tempfile
          wheel, = pathlib.Path('dist').glob('*.whl')
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              env = root / 'venv'
              python = env / 'bin/python'
              variables = os.environ.copy()
              variables['UV_PROJECT_ENVIRONMENT'] = str(env)
              subprocess.run(['uv', 'sync', '--locked', '--no-build', '--no-dev', '--no-install-project'],
                             env=variables, check=True)
              subprocess.run(['uv', 'pip', 'install', '--python', str(python), '--no-deps',
                              '--no-build', str(wheel.resolve())], cwd=pathlib.Path.home(), check=True)
              subprocess.run([str(python), '-I', '-c', 'import pyracast; print(pyracast.__version__)'],
                             cwd=pathlib.Path.home(), check=True)
      - id: coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  web_ubuntu:
    name: Web (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      web-coverage: ${{ steps.web-coverage.outputs.artifact-id }}
    env:
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: pyracast
      PGDATABASE: pyracast
      PYRACAST_SECRET_KEY: ci-only-key-not-for-deployment
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-sync --no-build python scripts/translations.py
      - run: uv run --locked --no-sync --no-build python -m scripts.start_postgres --ephemeral --non-durable
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: web
      - name: Verify API schema and generated types
        run: uv run --locked --no-sync --no-build python scripts/generate_api_schema.py --check
      - run: npm run check:coverage
        working-directory: web
      - name: Audit web dependencies against dated exceptions
        run: uv run --locked --no-sync --no-build python scripts/npm_audit.py web
      - name: Run the browser scenarios against Django, PostgreSQL and the production web build
        run: uv run --locked --no-sync --no-build python -m pytest tests/e2e -m browser -n 1 --no-cov
      - name: Upload Playwright failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: |
            web/integration-results/**/trace.zip
            web/integration-results/**/error-context.md
            web/coverage/test-results/**/trace.zip
            web/coverage/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3
      - id: web-coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage-${{ github.run_attempt }}
          path: web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  web_production:
    name: Web production build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - name: Build the same source a second time for the release scenarios
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-second
      - name: Run the worker scenarios against the production web build
        run: npm run test:production
      - name: Run the mocked browser suite against the production web build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm test
        env:
          PLAYWRIGHT_ACCEPT_PASS_ON_RETRY: '1'
      - name: Upload Playwright failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-production-results-${{ github.run_attempt }}
          path: |
            web/production-results/**/trace.zip
            web/production-results/**/error-context.md
            web/test-results/**/trace.zip
            web/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3

  scientific:
    name: Scientific (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9
          enable-cache: true
          cache-suffix: scientific
      - name: Check scientific dependencies
        shell: python
        run: |
          import subprocess
          subprocess.run(['uv', 'python', 'install', '3.15.2'], check=True)
          python = subprocess.check_output(['uv', 'python', 'find', '3.15.2'], text=True).strip()
          subprocess.run([python, 'scripts/check_scientific.py'], check=True)

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9
          enable-cache: true
      - run: uv sync --locked --no-build
      - run: uv export --locked --all-groups --all-extras --no-emit-project --no-hashes --output-file audit-requirements.txt
      - run: uv run --locked --no-sync --no-build pip-audit --strict --no-deps --disable-pip --requirement audit-requirements.txt

  sonar:
    name: Sonar quality gate
    needs: [verify_ubuntu, web_ubuntu]
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      COVERAGE_ARTIFACT: ${{ needs.verify_ubuntu.outputs.coverage }}
      WEB_COVERAGE_ARTIFACT: ${{ needs.web_ubuntu.outputs.web-coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the artifacts the producing jobs uploaded
        run: |
          [[ $COVERAGE_ARTIFACT =~ ^[0-9]+$ ]]
          [[ $WEB_COVERAGE_ARTIFACT =~ ^[0-9]+$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ env.COVERAGE_ARTIFACT }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ env.WEB_COVERAGE_ARTIFACT }}
          path: web/coverage
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error
      - name: Validate Sonar configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        shell: python
        run: |
          import os
          missing = [name for name in ('SONAR_TOKEN', 'SONAR_PROJECT_KEY', 'SONAR_ORGANIZATION')
                     if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing Sonar configuration: ' + ', '.join(missing))
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  ci_result:
    name: CI result
    needs: [deployment, verify_ubuntu, web_ubuntu, web_production, scientific, audit, sonar]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every CI job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_result.py

  # Outside CI result, and no repository code runs here: the release compares this record of the
  # tested base and tree with the squash merge on main. Without it the merge takes the full path.
  pr_tested:
    name: Record the tested tree
    needs: [deployment, verify_ubuntu, web_ubuntu, web_production, scientific, audit, sonar, ci_result]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.ci_result.result == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the tree this pull request run tested
        id: tested
        env:
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t parents < <(git cat-file commit HEAD | sed -n '/^$/q; s/^parent //p')
          if [[ ${#parents[@]} -eq 2 && "${parents[1]}" == "$PULL_REQUEST_HEAD" ]]; then
            git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/pr-tested.txt"
            echo "base=${parents[0]}" >> "$GITHUB_OUTPUT"
            echo "tree=$(cat "$RUNNER_TEMP/pr-tested.txt")" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::HEAD is not the merge of this pull request; no tested tree is recorded.'
          fi
      - name: Record the tested tree for an early release of its squash merge
        if: steps.tested.outputs.tree != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-tested-${{ github.event.pull_request.number }}-${{ steps.tested.outputs.base }}-${{ steps.tested.outputs.tree }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-tested.txt
          if-no-files-found: error
          retention-days: 7

  # Outside CI result: a failed start leaves the release to the end of this run.
  # It waits for web_production: the pull request run does not test the shipped web build.
  release_start:
    name: Start the release of a proven merge
    needs: [deployment, web_production]
    if: vars.GCP_DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Ask Release to judge these images before the repeated jobs end
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'release.yml', ref: 'main',
              inputs: { ci_run_id: String(context.runId), ci_run_attempt: process.env.GITHUB_RUN_ATTEMPT },
            });

  # Outside CI result: a failed job of a pull request run cancels the rest of the run. A job waits
  # for every job it needs, so each stop job needs exactly one.
  stop_after_deployment:
    name: &stop-name Stop the pull request run
    needs: deployment
    if: &stop-condition failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: &stop-permissions
      actions: write
    steps: &stop-steps
      - name: Cancel the run after a failed job
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: 'await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: context.runId });'

  stop_after_verify:
    name: *stop-name
    needs: verify_ubuntu
    if: *stop-condition
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: *stop-permissions
    steps: *stop-steps

  stop_after_web:
    name: *stop-name
    needs: web_ubuntu
    if: *stop-condition
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: *stop-permissions
    steps: *stop-steps

  stop_after_web_production:
    name: *stop-name
    needs: web_production
    if: *stop-condition
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: *stop-permissions
    steps: *stop-steps

  stop_after_scientific:
    name: *stop-name
    needs: scientific
    if: *stop-condition
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: *stop-permissions
    steps: *stop-steps

  stop_after_audit:
    name: *stop-name
    needs: audit
    if: *stop-condition
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: *stop-permissions
    steps: *stop-steps
