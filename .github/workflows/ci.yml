name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    name: Deployment configuration and containers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      - name: Validate GitHub workflows and deployment scripts
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -c 'actionlint -color && shellcheck deploy/*.sh'
      - name: Verify release failure recovery without cloud access
        run: >-
          docker run --rm --network none --cap-drop ALL --entrypoint bash
          -v "$PWD/deploy:/source:ro"
          python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
          /source/test-release.sh
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Validate Terraform without cloud credentials or backend access
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - run: mkdir -p "$RUNNER_TEMP/release-images"
      - name: Build the production backend without cloud credentials
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: pyracast-backend:ci
          outputs: type=oci,dest=${{ runner.temp }}/release-images/backend.oci.tar
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-linux-amd64,timeout=2m
          cache-to: type=gha,scope=backend-linux-amd64,mode=max,ignore-error=true,timeout=2m
      - name: Build the production web without cloud credentials
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          tags: pyracast-web:ci
          outputs: type=oci,dest=${{ runner.temp }}/release-images/web.oci.tar
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web-linux-amd64,timeout=2m
          cache-to: type=gha,scope=web-linux-amd64,mode=max,ignore-error=true,timeout=2m
      - name: Build the production gateway
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/gateway
          platforms: linux/amd64
          tags: pyracast-gateway:ci
          outputs: type=oci,dest=${{ runner.temp }}/release-images/gateway.oci.tar
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=gateway-linux-amd64,timeout=2m
          cache-to: type=gha,scope=gateway-linux-amd64,mode=max,ignore-error=true,timeout=2m
      - name: Build the production PostgreSQL image
        id: postgres
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          platforms: linux/amd64
          tags: pyracast-postgres:ci
          outputs: type=oci,dest=${{ runner.temp }}/release-images/postgres.oci.tar
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=postgres-linux-amd64,timeout=2m
          cache-to: type=gha,scope=postgres-linux-amd64,mode=max,ignore-error=true,timeout=2m
      - name: Bind the image archives to this exact CI run
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
        run: |
          for image in backend web gateway postgres; do
            variable="${image^^}_DIGEST"
            printf '%s\n' "${!variable}" > "$RUNNER_TEMP/release-images/$image.digest"
          done
          uv run --no-project --python 3.15.2 python deploy/ci_images.py prepare "$RUNNER_TEMP/release-images" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          bash deploy/oci-images.sh load "$RUNNER_TEMP/release-images" "$GITHUB_SHA"
      - name: Scan gateway, RabbitMQ and PostgreSQL
        run: |
          POSTGRES_IMAGE=$(docker image inspect pyracast-postgres:ci --format '{{.Id}}')
          [[ "$POSTGRES_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "POSTGRES_IMAGE=$POSTGRES_IMAGE" >> "$GITHUB_ENV"
          bash deploy/scan-support.sh pyracast-gateway:ci "$POSTGRES_IMAGE"
      - name: Exercise the production images and Compose boundary
        run: bash deploy/smoke.sh pyracast-backend:ci pyracast-web:ci pyracast-gateway:ci "$POSTGRES_IMAGE"
      - name: Retain tested main images for the release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-images/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  verify_ubuntu:
    name: Verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_SHARD: full
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: pyracast
      PGDATABASE: pyracast
      PYRACAST_SECRET_KEY: ci-only-key-not-for-deployment
      PYTEST_XDIST_AUTO_NUM_WORKERS: '2'
    steps: &verify-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-sync --no-build python scripts/start_postgres.py --non-durable
      - name: Start RabbitMQ (Windows)
        if: runner.os == 'Windows'
        run: uv run --locked --no-sync --no-build python scripts/start_rabbitmq.py
      - name: Start RabbitMQ (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          RABBITMQ_DEFAULT_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::${RABBITMQ_DEFAULT_PASS}"
          export RABBITMQ_DEFAULT_PASS
          docker run -d --name pyracast-rabbitmq -p 127.0.0.1:5672:5672 -e RABBITMQ_DEFAULT_USER=pyracast -e RABBITMQ_DEFAULT_PASS rabbitmq:4.4.0@sha256:485319d42170eab53d8a030e1cc49d95e41f5d325479fa504736db8091981eb7
          for _ in $(seq 1 90); do
            if docker exec --user rabbitmq pyracast-rabbitmq rabbitmq-diagnostics -q check_running; then
              echo 'PYRACAST_LIVE_QUEUE=1' >> "$GITHUB_ENV"
              echo "PYRACAST_RABBITMQ_URL=amqp://pyracast:${RABBITMQ_DEFAULT_PASS}@127.0.0.1:5672/%2F" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs pyracast-rabbitmq
          exit 1
      - run: uv run --locked --no-sync --no-build pyracast migrate --noinput
      - run: uv run --locked --no-sync --no-build pyracast migrate --check
      - run: uv run --locked --no-sync --no-build pyracast check
      - name: Report test worker allocation
        run: >-
          uv run --locked --no-sync --no-build python -c
          "import os, psutil; print({'xdist_workers': os.environ['PYTEST_XDIST_AUTO_NUM_WORKERS'], 'physical_cpus': psutil.cpu_count(logical=False), 'logical_cpus': psutil.cpu_count()})"
      - name: Run all quality checks and record test timings
        if: runner.os == 'Linux'
        env:
          PYTEST_ADDOPTS: --junitxml=test-results/pytest.xml --durations=25
        run: uv run --locked --no-sync --no-build python scripts/check.py
      - name: Run a complete Windows test partition
        if: runner.os == 'Windows'
        env:
          PYTEST_ADDOPTS: --junitxml=test-results/pytest.xml --durations=25
        run: >-
          uv run --locked --no-sync --no-build python scripts/check.py
          --shard ${{ env.TEST_SHARD }}/4 --shard-output "${{ runner.temp }}/windows-shard-${{ env.TEST_SHARD }}"
      - name: Upload test timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-results-${{ runner.os }}-${{ env.TEST_SHARD }}-${{ github.run_attempt }}
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Windows coverage and test inventory
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-shard-${{ github.run_attempt }}-${{ env.TEST_SHARD }}
          path: ${{ runner.temp }}/windows-shard-${{ env.TEST_SHARD }}/
          if-no-files-found: error
          retention-days: 1
      - run: uv build --no-sources
        if: runner.os == 'Linux' || env.TEST_SHARD == '1'
      - name: Check wheel in an isolated environment
        if: runner.os == 'Linux' || env.TEST_SHARD == '1'
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          wheel, = pathlib.Path('dist').glob('*.whl')
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              env = root / 'venv'
              python = env / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
              variables = os.environ.copy()
              variables['UV_PROJECT_ENVIRONMENT'] = str(env)
              subprocess.run(['uv', 'sync', '--locked', '--no-build', '--no-dev', '--no-install-project'],
                             env=variables, check=True)
              subprocess.run(['uv', 'pip', 'install', '--python', str(python), '--no-deps',
                              '--no-build', str(wheel.resolve())], cwd=pathlib.Path.home(), check=True)
              subprocess.run([str(python), '-I', '-c', 'import pyracast; print(pyracast.__version__)'],
                             cwd=pathlib.Path.home(), check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: coverage-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  verify_windows_shards:
    name: Windows tests (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TEST_SHARD: ${{ matrix.shard }}
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: pyracast
      PGDATABASE: pyracast
      PYRACAST_SECRET_KEY: ci-only-key-not-for-deployment
      PYTEST_XDIST_AUTO_NUM_WORKERS: '2'
    steps: *verify-steps

  verify_windows:
    name: Verify (windows-latest)
    needs: verify_windows_shards
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
      - run: uv sync --locked --no-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-shard-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/windows-shards
          digest-mismatch: error
      - name: Require every Windows test and the unchanged combined coverage floor
        run: >-
          uv run --locked --no-sync --no-build python scripts/check.py --combine-shards
          "${{ runner.temp }}/windows-shards/windows-shard-${{ github.run_attempt }}-1"
          "${{ runner.temp }}/windows-shards/windows-shard-${{ github.run_attempt }}-2"
          "${{ runner.temp }}/windows-shards/windows-shard-${{ github.run_attempt }}-3"
          "${{ runner.temp }}/windows-shards/windows-shard-${{ github.run_attempt }}-4"

  web_ubuntu:
    name: Web (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: &web-environment
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: pyracast
      PGDATABASE: pyracast
      PYRACAST_SECRET_KEY: ci-only-key-not-for-deployment
      PYRACAST_BROWSER_TEST: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps: &web-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-sync --no-build python scripts/translations.py
      - run: uv run --locked --no-sync --no-build python scripts/start_postgres.py --non-durable
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npx --no-install playwright install --with-deps chromium
        if: runner.os == 'Linux'
        working-directory: web
      # On Windows, --with-deps only adds Server-Media-Foundation (about 3 minutes); no test plays media.
      - run: npx --no-install playwright install chromium
        if: runner.os == 'Windows'
        working-directory: web
      - name: Verify API schema and generated types
        run: uv run --locked --no-sync --no-build python scripts/generate_api_schema.py --check
      - run: npm run check
        if: runner.os == 'Windows'
        working-directory: web
      - run: npm run check:coverage
        if: runner.os == 'Linux'
        working-directory: web
      - name: Audit web dependencies against dated exceptions
        run: uv run --locked --no-sync --no-build python scripts/npm_audit.py web
      - name: Exercise browser against Django and PostgreSQL
        run: uv run --locked --no-sync --no-build python -m pytest tests/test_browser.py -n 1 --no-cov
      - name: Upload Playwright failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/trace.zip
            web/test-results/**/error-context.md
            web/integration-results/**/trace.zip
            web/integration-results/**/error-context.md
            web/coverage/test-results/**/trace.zip
            web/coverage/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: web-coverage-${{ github.run_attempt }}
          path: web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  web_windows:
    name: Web (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    env: *web-environment
    steps: *web-steps

  scientific:
    name: Scientific (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
          cache-suffix: scientific
      - name: Check scientific dependencies
        shell: python
        run: |
          import subprocess
          subprocess.run(['uv', 'python', 'install', '3.15.2'], check=True)
          python = subprocess.check_output(['uv', 'python', 'find', '3.15.2'], text=True).strip()
          subprocess.run([python, 'scripts/check_scientific.py'], check=True)

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
      - run: uv sync --locked --no-build
      - run: uv export --locked --all-groups --all-extras --no-emit-project --no-hashes --output-file audit-requirements.txt
      - run: uv run --locked --no-sync --no-build pip-audit --strict --no-deps --disable-pip --requirement audit-requirements.txt

  sonar:
    name: Sonar quality gate
    needs: [verify_ubuntu, web_ubuntu]
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      github.event_name != 'merge_group' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-${{ github.run_attempt }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-coverage-${{ github.run_attempt }}
          path: web/coverage
      - name: Validate Sonar configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        shell: python
        run: |
          import os
          missing = [name for name in ('SONAR_TOKEN', 'SONAR_PROJECT_KEY', 'SONAR_ORGANIZATION')
                     if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing Sonar configuration: ' + ', '.join(missing))
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
