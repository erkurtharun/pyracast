name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: pyracast
      PGDATABASE: pyracast
      PYRACAST_SECRET_KEY: ci-only-key-not-for-deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python scripts/start_postgres.py
      - name: Start RabbitMQ (Windows)
        if: matrix.os == 'windows-latest'
        run: uv run --locked python scripts/start_rabbitmq.py
      - name: Start RabbitMQ (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d --name pyracast-rabbitmq -p 127.0.0.1:5672:5672 -e RABBITMQ_DEFAULT_USER=pyracast -e RABBITMQ_DEFAULT_PASS=pyracast rabbitmq:4.4.0@sha256:485319d42170eab53d8a030e1cc49d95e41f5d325479fa504736db8091981eb7
          for attempt in $(seq 1 90); do
            if docker exec --user rabbitmq pyracast-rabbitmq rabbitmq-diagnostics -q check_running; then
              echo 'PYRACAST_LIVE_QUEUE=1' >> "$GITHUB_ENV"
              echo 'PYRACAST_RABBITMQ_URL=amqp://pyracast:pyracast@127.0.0.1:5672/%2F' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs pyracast-rabbitmq
          exit 1
      - run: uv run --locked pyracast migrate --noinput
      - run: uv run --locked pyracast check
      - run: uv run --locked python scripts/check.py
      - run: uv build --no-sources
      - name: Check wheel in an isolated environment
        shell: python
        run: |
          import pathlib
          import subprocess
          wheel, = pathlib.Path('dist').glob('*.whl')
          subprocess.run(['uv', 'run', '--no-project', '--python', '3.15.2', '--with', str(wheel.resolve()),
                          'python', '-I', '-c', 'import pyracast; print(pyracast.__version__)'],
                         cwd=pathlib.Path.home(), check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
      - run: uv sync --locked
      - run: uv export --locked --all-groups --no-emit-project --no-hashes --output-file audit-requirements.txt
      - run: uv run --locked pip-audit --strict --no-deps --disable-pip --requirement audit-requirements.txt

  sonar:
    name: Sonar quality gate
    needs: [verify]
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      github.event_name != 'merge_group' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Validate Sonar configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        shell: python
        run: |
          import os
          missing = [name for name in ('SONAR_TOKEN', 'SONAR_PROJECT_KEY', 'SONAR_ORGANIZATION')
                     if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing Sonar configuration: ' + ', '.join(missing))
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
