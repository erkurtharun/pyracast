name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Leave empty. CI names its own run here once its images have passed.
        required: false
        type: string
      ci_run_attempt:
        description: Leave empty. The attempt of that CI run.
        required: false
        type: string

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      vars.GCP_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.decision.outputs.authorized }}
      sha: ${{ steps.decision.outputs.sha }}
      ci_run_id: ${{ steps.decision.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.decision.outputs.ci_run_attempt }}
      artifact_id: ${{ steps.decision.outputs.artifact_id }}
      ci_started_at: ${{ steps.decision.outputs.ci_started_at }}
      proven: ${{ steps.decision.outputs.proven }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      # The default ref is main (workflow_run, or a dispatch on main), never a fork's code. A main
      # that moves after this clone leaves the authorized commit out of it; classification then
      # fails and the release goes ahead.
      - name: Check out main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect the CI run of the current main commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
        with:
          script: |
            const fs = require('fs');
            const repository = context.repo;
            const { data: workflow } = await github.rest.actions.getWorkflow({
              ...repository, workflow_id: 'ci.yml',
            });
            const { data: main } = await github.rest.repos.getBranch({ ...repository, branch: 'main' });
            const inputs = context.payload.inputs ?? {};
            // CI's early start names its run; an operator's dispatch names none and keeps today's rule.
            const requested = context.eventName === 'workflow_dispatch' && inputs.ci_run_id
              ? { id: inputs.ci_run_id, run_attempt: inputs.ci_run_attempt ?? '' } : null;
            // A re-run keeps the original event payload, so it judges the same CI attempt.
            const source = requested ?? (context.eventName === 'workflow_run' ? context.payload.workflow_run : null);
            if (source && ![source.id, source.run_attempt].every(value => /^[1-9][0-9]*$/.test(String(value)))) {
              throw new Error('The requested CI run is not a run id and attempt.');
            }
            const described = candidate => candidate && {
              id: candidate.id, run_attempt: candidate.run_attempt, workflow_id: candidate.workflow_id,
              path: candidate.path, repository: candidate.repository.full_name,
              head_repository: candidate.head_repository?.full_name ?? null, event: candidate.event,
              head_branch: candidate.head_branch, head_sha: candidate.head_sha, status: candidate.status,
              conclusion: candidate.conclusion, created_at: candidate.created_at,
              run_started_at: candidate.run_started_at,
            };
            const jobsOf = async candidate => (await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...repository, run_id: candidate.id, attempt_number: candidate.run_attempt, per_page: 100,
            })).map(job => ({ name: job.name, conclusion: job.conclusion }));
            const artifactsOf = async candidate => (await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...repository, run_id: candidate.id, per_page: 100,
            })).map(artifact => ({
              id: artifact.id, name: artifact.name, expired: artifact.expired,
              head_sha: artifact.workflow_run?.head_sha ?? null,
            }));
            // A failed lookup for an early start leaves it unproven; the release after the whole run decides.
            let run = null;
            let jobs = [];
            let artifacts = [];
            let runError = null;
            try {
              if (source) {
                ({ data: run } = await github.rest.actions.getWorkflowRunAttempt({
                  ...repository, run_id: Number(source.id), attempt_number: Number(source.run_attempt),
                }));
              } else {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  ...repository, workflow_id: workflow.id, branch: 'main', head_sha: main.commit.sha, per_page: 100,
                });
                run = data.workflow_runs.find(candidate =>
                  ['push', 'workflow_dispatch'].includes(candidate.event) && candidate.conclusion === 'success') ?? null;
              }
              if (run) {
                jobs = await jobsOf(run);
                artifacts = await artifactsOf(run);
              }
            } catch (error) {
              if (!requested) throw error;
              runError = error.message;
            }
            // Unreadable deployments leave the release as it was before early starts existed.
            let deployments = null;
            try {
              const records = [];
              for (const deployment of await github.paginate(github.rest.repos.listDeployments, {
                ...repository, environment: 'production', sha: main.commit.sha, per_page: 100,
              })) {
                const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                  ...repository, deployment_id: deployment.id, per_page: 100,
                });
                records.push({ sha: deployment.sha, created_at: deployment.created_at,
                  statuses: statuses.map(({ id, state, created_at }) => ({ id, state, created_at })) });
              }
              deployments = records;
            } catch (error) {
              core.warning(`Production deployments unavailable: ${error.message}`);
            }
            // Any failure here leaves the early start unproven; the release after the whole run decides.
            let proof = null;
            if (requested) {
              try {
                const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                  ...repository, commit_sha: main.commit.sha, per_page: 100,
                });
                const merged = pulls.filter(pull => pull.merged_at && pull.merge_commit_sha === main.commit.sha);
                proof = {
                  pull_requests: merged.map(pull => ({
                    number: pull.number, merge_commit_sha: pull.merge_commit_sha, base_ref: pull.base.ref,
                    base_repository: pull.base.repo.full_name, head_repository: pull.head.repo?.full_name ?? null,
                    head_sha: pull.head.sha,
                  })),
                  run: null, jobs: [], artifacts: [],
                };
                if (merged.length === 1) {
                  const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                    ...repository, workflow_id: workflow.id, event: 'pull_request', head_sha: merged[0].head.sha, per_page: 100,
                  });
                  const tested = runs.reduce((newest, candidate) =>
                    newest && newest.id > candidate.id ? newest : candidate, null);
                  if (tested) {
                    proof.run = described(tested);
                    proof.jobs = await jobsOf(tested);
                    proof.artifacts = await artifactsOf(tested);
                  }
                }
              } catch (error) {
                proof = { error: error.message };
              }
            }
            const facts = {
              event: context.eventName,
              event_sha: context.sha,
              main_sha: main.commit.sha,
              repository: `${repository.owner}/${repository.repo}`,
              workflow_id: workflow.id,
              requested_run: requested && { id: Number(requested.id), attempt: Number(requested.run_attempt) },
              run: described(run),
              run_error: runError,
              jobs,
              artifacts,
              deployments,
              proof,
              sonar_enabled: process.env.SONAR_ENABLED === 'true',
            };
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-facts.json`, JSON.stringify(facts));
      - name: Authorize the current main commit against its exact CI run
        id: decision
        run: python3 deploy/release_authorization.py authorize "$RUNNER_TEMP/release-facts.json"
      # The classification steps only ever narrow the release to a skip; each of them failing
      # leaves the release output unset, and deploy runs unless it is exactly 'false'.
      # A newest deployment (by created_at) whose newest status is not success leaves production
      # in doubt, so only the newest deployment can serve as the baseline, never an older one.
      - name: Find the commit of the newest production deployment when it succeeded
        id: deployed
        if: steps.decision.outputs.authorized == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              // Records can share a one-second creation time; GitHub numbers them in creation order.
              const newest = records => records.reduce((latest, record) => {
                const later = Date.parse(record.created_at) - Date.parse(latest.created_at);
                return later > 0 || (later === 0 && record.id > latest.id) ? record : latest;
              });
              const { data: deployments } = await github.rest.repos.listDeployments({
                ...context.repo, environment: 'production', per_page: 10,
              });
              if (deployments.length === 0) {
                core.warning('No production deployment found; releasing.');
                return;
              }
              const deployment = newest(deployments);
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deployment.id, per_page: 100,
              });
              if (statuses.length > 0 && newest(statuses).state === 'success') {
                core.setOutput('sha', deployment.sha);
              } else {
                core.warning('The newest production deployment has not succeeded; releasing.');
              }
            } catch (error) {
              core.warning(`Deployment record unavailable; releasing: ${error.message}`);
            }
      - name: Classify the changes since the deployed commit
        id: classify
        if: steps.decision.outputs.authorized == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
          RELEASE_SHA: ${{ steps.decision.outputs.sha }}
          RELEASE_EVENT: ${{ inputs.ci_run_id != '' && 'workflow_run' || github.event_name }}
        run: python3 deploy/release_scope.py "$RELEASE_EVENT" "$DEPLOYED_SHA" "$RELEASE_SHA"

  scan:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true' && needs.authorize.outputs.release != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.9
      # An automatic release starts early and again after the whole CI run; the later one ends
      # here without failing once the other has deployed and its cleanup may remove the images.
      - name: Find the production deployments of this commit before the download
        if: github.event_name == 'workflow_run' || inputs.ci_run_id != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &find-deployments |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/release-deployments.json`;
            fs.rmSync(path, { force: true });
            const records = [];
            for (const deployment of await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment: 'production', sha: process.env.RELEASE_SHA, per_page: 100,
            })) {
              const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                ...context.repo, deployment_id: deployment.id, per_page: 100,
              });
              records.push({ sha: deployment.sha, created_at: deployment.created_at,
                statuses: statuses.map(({ id, state, created_at }) => ({ id, state, created_at })) });
            }
            fs.writeFileSync(path, JSON.stringify(records));
      - name: Read the current main commit before the download
        id: main-before
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &read-main |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            core.setOutput('sha', data.commit.sha);
      - name: Decide before the download whether this release is still needed
        id: before
        env:
          MAIN_SHA: ${{ steps.main-before.outputs.sha }}
          CI_STARTED_AT: ${{ needs.authorize.outputs.ci_started_at }}
        run: &decide-current python3 deploy/release_authorization.py current "$MAIN_SHA" "$RELEASE_SHA" --deployments "$RUNNER_TEMP/release-deployments.json" --since "$CI_STARTED_AT"
      - name: Download images from the exact authorized CI run
        id: download
        if: steps.before.outputs.current == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.authorize.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-images
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.ci_run_id }}
          digest-mismatch: error
      - name: Verify source, run and immutable archive contents
        if: steps.download.outcome == 'success'
        env:
          CI_RUN_ID: ${{ needs.authorize.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.ci_run_attempt }}
        run: >-
          uv run --no-project --python 3.15.2 python deploy/ci_images.py verify
          "$RUNNER_TEMP/release-images" "$RELEASE_SHA" "$CI_RUN_ID" "$CI_RUN_ATTEMPT"
      - name: Load the verified images
        if: steps.download.outcome == 'success'
        run: bash deploy/oci-images.sh load "$RUNNER_TEMP/release-images" "$RELEASE_SHA"
      - name: Scan every image; block every high or critical vulnerability
        if: steps.download.outcome == 'success'
        run: |
          POSTGRES_IMAGE=$(docker image inspect pyracast-postgres:ci --format '{{.Id}}')
          RABBITMQ_IMAGE=$(docker image inspect pyracast-rabbitmq:ci --format '{{.Id}}')
          [[ "$POSTGRES_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RABBITMQ_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash deploy/scan-images.sh pyracast-backend:ci pyracast-web:ci pyracast-gateway:ci "$POSTGRES_IMAGE" "$RABBITMQ_IMAGE"
      - name: Find the production deployments of this commit
        if: steps.before.outputs.current == 'true' && (github.event_name == 'workflow_run' || inputs.ci_run_id != '')
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *find-deployments
      - name: Read the current main commit
        id: main
        if: steps.before.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *read-main
      - name: Skip a release that main has moved past
        id: current
        if: steps.before.outputs.current == 'true'
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
          CI_STARTED_AT: ${{ needs.authorize.outputs.ci_started_at }}
        run: *decide-current
      # Images vanish only through the cleanup after a successful deployment of this commit; any
      # other failed download stays a failed release.
      - name: Refuse images that vanished without a release of this commit
        if: steps.download.outcome == 'failure' && steps.current.outputs.current == 'true'
        run: |
          echo '::error::The image artifact could not be downloaded and no release of this commit has succeeded.'
          exit 1

  deploy:
    needs: [authorize, scan]
    if: needs.scan.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      id-token: write
      deployments: read
    env:
      RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_MIGRATION_SECRET: ${{ vars.GCP_MIGRATION_SECRET }}
      GCP_MIGRATION_SECRET_VERSION: ${{ vars.GCP_MIGRATION_SECRET_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: erkurtharun/pyracast
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Move to the authorized commit, which must be on main
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          git checkout --detach "$RELEASE_SHA"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.9
      # The other release of this commit held this serialized job until it ended; its success
      # is recorded before this job starts, while its cleanup may already remove the images.
      - name: Find the production deployments of this commit before the download
        if: github.event_name == 'workflow_run' || inputs.ci_run_id != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *find-deployments
      - name: Read the current main commit before the download
        id: main-before
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *read-main
      - name: Decide before the download whether this release is still needed
        id: before
        env:
          MAIN_SHA: ${{ steps.main-before.outputs.sha }}
          CI_STARTED_AT: ${{ needs.authorize.outputs.ci_started_at }}
        run: *decide-current
      - name: Cancel a release that is no longer needed before the download
        if: steps.before.outputs.current != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &cancel-release |
            await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: context.runId });
            await new Promise(resolve => setTimeout(resolve, 300000));
            core.setFailed('The release was not cancelled; nothing was transferred.');
      - name: Download images from the exact authorized CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.authorize.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-images
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.ci_run_id }}
          digest-mismatch: error
      - name: Verify source, run and immutable archive contents before cloud authentication
        env:
          CI_RUN_ID: ${{ needs.authorize.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.ci_run_attempt }}
        run: >-
          uv run --no-project --python 3.15.2 python deploy/ci_images.py verify
          "$RUNNER_TEMP/release-images" "$RELEASE_SHA" "$CI_RUN_ID" "$CI_RUN_ATTEMPT"
      - name: Validate deployment configuration
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          for name in RELEASE_SHA GCP_PROJECT_ID GCP_ZONE GCP_INSTANCE GCP_ARTIFACT_REPOSITORY GCP_MIGRATION_SECRET GCP_WIF_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            test -n "${!name}" || { echo "Missing production variable: $name"; exit 1; }
          done
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GCP_ARTIFACT_REPOSITORY" =~ ^[a-z0-9-]+-docker\.pkg\.dev/[a-z0-9-]+/[a-z0-9_-]+$ ]]
          [[ "$GCP_INSTANCE" =~ ^[a-z][a-z0-9-]*$ ]]
          [[ "$GCP_ZONE" =~ ^[a-z0-9-]+$ ]]
          [[ -z $GCP_MIGRATION_SECRET_VERSION || $GCP_MIGRATION_SECRET_VERSION =~ ^[1-9][0-9]*$ ]] \
            || { echo 'GCP_MIGRATION_SECRET_VERSION must be a positive Secret Manager version number.'; exit 1; }
          echo "Migration secret version: ${GCP_MIGRATION_SECRET_VERSION:-latest}" >> "$GITHUB_STEP_SUMMARY"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: google-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 593.0.0
      - name: Configure Artifact Registry credentials
        run: gcloud auth configure-docker "${GCP_ARTIFACT_REPOSITORY%%/*}" --quiet
      - name: Protect the live release from registry cleanup
        run: python3 deploy/pin_release_images.py current
      - name: Publish the exact CI images with their provenance and SBOM
        env:
          REGISTRY_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: bash deploy/oci-images.sh publish "$RUNNER_TEMP/release-images" "$RELEASE_SHA" "$GCP_ARTIFACT_REPOSITORY"
      # This job's own deployment is still in progress, so a successful one belongs to the other
      # release of this commit. A failed lookup leaves no records and the release goes on.
      - name: Find the production deployments of this commit
        if: github.event_name == 'workflow_run' || inputs.ci_run_id != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *find-deployments
      - name: Read the current main commit
        id: main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *read-main
      - name: Decide whether main has moved past this release
        id: current
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
          CI_STARTED_AT: ${{ needs.authorize.outputs.ci_started_at }}
        run: *decide-current
      # A successful job here records a production deployment that the next release classifies its
      # changes against, so a release that installs nothing ends cancelled, never successful.
      - name: Cancel a release that main has moved past
        if: steps.current.outputs.current != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *cancel-release
      # The installer runs in a transient systemd unit, so a cancelled job or a dropped tunnel only
      # stops following it; a lost connection (ssh status 255) follows the same unit again.
      - name: Transfer the verified release and deploy through IAP
        run: |
          set -euo pipefail
          umask 077
          stage="/run/pyracast-release-$RELEASE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          unit="${stage#/run/}.service"
          local_stage="$(mktemp -d)"
          ssh=(gcloud compute ssh "$GCP_INSTANCE" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE"
            --tunnel-through-iap --ssh-key-expire-after=1h --quiet)
          cleanup() {
            rm -f "$local_stage/migration.json" "$local_stage/release.tar.gz"
            rmdir "$local_stage"
            "${ssh[@]}" --command="if sudo systemctl is-active --quiet '$unit'; then echo 'The release unit $unit still runs; its stage stays until the host restarts.'; else sudo rm -rf -- '$stage'; fi" || true
          }
          trap cleanup EXIT
          git archive --format=tar.gz --output="$local_stage/release.tar.gz" "$RELEASE_SHA" deploy
          gcloud secrets versions access "${GCP_MIGRATION_SECRET_VERSION:-latest}" --secret="$GCP_MIGRATION_SECRET" \
            --project="$GCP_PROJECT_ID" --out-file="$local_stage/migration.json"
          "${ssh[@]}" --command="umask 077; sudo install -d -m 0700 -o \"\$(id -u)\" -g \"\$(id -g)\" '$stage' && mkdir '$stage/bundle'"
          gcloud compute scp "$local_stage/release.tar.gz" "$local_stage/migration.json" "$GCP_INSTANCE:$stage/" \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=1h --quiet
          status=0
          "${ssh[@]}" --command="tar -xzf '$stage/release.tar.gz' -C '$stage/bundle' && sudo python3 '$stage/bundle/deploy/release_unit.py' start '$stage' '$RELEASE_SHA' '$BACKEND_IMAGE' '$WEB_IMAGE' '$GATEWAY_IMAGE' '$POSTGRES_IMAGE' '$RABBITMQ_IMAGE'" || status=$?
          attempt=0
          while (( status == 255 && attempt < 30 )); do
            attempt=$((attempt + 1))
            echo "The connection to the host was lost; following the release unit again ($attempt)."
            sleep 20
            status=0
            "${ssh[@]}" --command="sudo python3 '$stage/bundle/deploy/release_unit.py' follow '$stage'" || status=$?
          done
          trap - EXIT
          cleanup
          exit "$status"
      - name: Protect the verified deployed digests from registry cleanup
        run: python3 deploy/pin_release_images.py published
      - name: Record the deployed digests
        run: |
          printf 'Released %s\n\nBackend: %s\n\nWeb: %s\n\nGateway: %s\n\nPostgreSQL: %s\n\nRabbitMQ: %s\n' "$RELEASE_SHA" "$BACKEND_IMAGE" "$WEB_IMAGE" "$GATEWAY_IMAGE" "$POSTGRES_IMAGE" "$RABBITMQ_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Probe the public origin through the edge
        env:
          PYRACAST_PUBLIC_ORIGIN: ${{ vars.PYRACAST_PUBLIC_ORIGIN }}
        run: python3 deploy/probe_origin.py "$PYRACAST_PUBLIC_ORIGIN"

  cleanup:
    needs: [authorize, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Same rule as cleanup_order in deploy/release_authorization.py: a Release re-run then finds
      # no build of this commit to fall back to and is refused.
      - name: Remove every image build up to the released one after successful deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          CI_RUN_ID: ${{ needs.authorize.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.ci_run_attempt }}
        with:
          script: |
            const { RELEASE_SHA: sha, CI_RUN_ID: runId, CI_RUN_ATTEMPT: released } = process.env;
            if (!/^[0-9a-f]{40}$/.test(sha) || !/^[1-9][0-9]*$/.test(runId) || !/^[1-9][0-9]*$/.test(released)) {
              throw new Error('Unreadable release handover; nothing was removed.');
            }
            const pattern = new RegExp(`^release-images-${sha}-([1-9][0-9]*)$`);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: Number(runId), per_page: 100,
            });
            const builds = artifacts
              .map(artifact => ({ artifact, match: pattern.exec(artifact.name) }))
              .filter(({ artifact, match }) => match && Number(match[1]) <= Number(released) && !artifact.expired)
              .map(({ artifact, match }) => ({ attempt: Number(match[1]), id: artifact.id }))
              .sort((first, second) => first.attempt - second.attempt || first.id - second.id);
            for (const { id } of builds) {
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: id });
            }
