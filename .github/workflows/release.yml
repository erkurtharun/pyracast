name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      vars.GCP_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
      ci_run_id: ${{ steps.authorize.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.authorize.outputs.ci_run_attempt }}
      artifact_id: ${{ steps.authorize.outputs.artifact_id }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - name: Authorize the current main commit against its exact CI run
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
        with:
          script: |
            const repository = context.repo;
            const { data: workflow } = await github.rest.actions.getWorkflow({
              ...repository, workflow_id: 'ci.yml',
            });
            const { data: main } = await github.rest.repos.getBranch({ ...repository, branch: 'main' });
            const sha = main.commit.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid main SHA');
            // The production deployment record carries the dispatch-time commit; it must be the one deployed.
            if (context.eventName === 'workflow_dispatch' && context.sha !== sha) {
              throw new Error('Main advanced after the dispatch; dispatch Release again');
            }
            let run;
            if (context.eventName === 'workflow_run') {
              ({ data: run } = await github.rest.actions.getWorkflowRun({
                ...repository, run_id: context.payload.workflow_run.id,
              }));
            } else {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...repository, workflow_id: workflow.id, branch: 'main', head_sha: sha, per_page: 100,
              });
              run = data.workflow_runs.find(candidate =>
                ['push', 'workflow_dispatch'].includes(candidate.event) && candidate.conclusion === 'success');
            }
            if (!run || run.workflow_id !== workflow.id || run.path !== '.github/workflows/ci.yml' ||
                run.repository.full_name !== `${repository.owner}/${repository.repo}` ||
                run.head_repository?.full_name !== `${repository.owner}/${repository.repo}` ||
                !['push', 'workflow_dispatch'].includes(run.event) || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('Only the current main SHA with successful repository CI may be released');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repository, run_id: run.id, filter: 'latest', per_page: 100,
            });
            const required = ['Deployment configuration and containers', 'Dependency audit',
              'Verify (ubuntu-latest)', 'Verify (windows-latest)',
              'Web (ubuntu-latest)', 'Web (windows-latest)',
              'Scientific (ubuntu-latest)', 'Scientific (windows-latest)'];
            if (process.env.SONAR_ENABLED === 'true') required.push('Sonar quality gate');
            if (required.some(name => !jobs.some(job => job.name === name && job.conclusion === 'success'))) {
              throw new Error('Every required CI job must pass for this run');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...repository, run_id: run.id, per_page: 100,
            });
            const candidates = artifacts.filter(artifact =>
              artifact.name === `release-images-${sha}-${run.run_attempt}` && !artifact.expired &&
              artifact.workflow_run?.head_sha === sha);
            if (candidates.length !== 1) throw new Error('Run CI again to produce an unexpired image artifact');
            core.setOutput('sha', sha);
            core.setOutput('ci_run_id', run.id);
            core.setOutput('ci_run_attempt', run.run_attempt);
            core.setOutput('artifact_id', candidates[0].id);
            await core.summary.addRaw(`Authorized main commit ${sha} using CI run ${run.id}.`).write();
      # The classification steps only ever narrow the release to a skip; each of them failing
      # leaves the release output unset, and deploy runs unless it is exactly 'false'.
      # A newest deployment (by created_at) whose newest status is not success leaves production
      # in doubt, so only the newest deployment can serve as the baseline, never an older one.
      - name: Find the commit of the newest production deployment when it succeeded
        id: deployed
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              const newest = records => records.reduce((latest, record) =>
                Date.parse(record.created_at) > Date.parse(latest.created_at) ? record : latest);
              const { data: deployments } = await github.rest.repos.listDeployments({
                ...context.repo, environment: 'production', per_page: 10,
              });
              if (deployments.length === 0) {
                core.warning('No production deployment found; releasing.');
                return;
              }
              const deployment = newest(deployments);
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deployment.id, per_page: 100,
              });
              if (statuses.length > 0 && newest(statuses).state === 'success') {
                core.setOutput('sha', deployment.sha);
              } else {
                core.warning('The newest production deployment has not succeeded; releasing.');
              }
            } catch (error) {
              core.warning(`Deployment record unavailable; releasing: ${error.message}`);
            }
      # The default ref is main (workflow_run, or a dispatch on main), never a fork's code. The
      # full-history clone fetches main after authorize, so it contains the authorized commit,
      # which the classifier receives as its argument whatever commit is checked out.
      - name: Check out main with full history
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changes since the deployed commit
        id: classify
        continue-on-error: true
        timeout-minutes: 1
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
          RELEASE_SHA: ${{ steps.authorize.outputs.sha }}
        run: python3 deploy/release_scope.py "$GITHUB_EVENT_NAME" "$DEPLOYED_SHA" "$RELEASE_SHA"

  deploy:
    needs: authorize
    if: needs.authorize.outputs.release != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_MIGRATION_SECRET: ${{ vars.GCP_MIGRATION_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
      - name: Confirm the trusted branch still matches the CI-authorized commit
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Download images from the exact authorized CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.authorize.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-images
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.ci_run_id }}
          digest-mismatch: error
      - name: Verify source, run and immutable archive contents before cloud authentication
        env:
          CI_RUN_ID: ${{ needs.authorize.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.authorize.outputs.ci_run_attempt }}
        run: >-
          uv run --no-project --python 3.15.2 python deploy/ci_images.py verify
          "$RUNNER_TEMP/release-images" "$RELEASE_SHA" "$CI_RUN_ID" "$CI_RUN_ATTEMPT"
      - name: Validate deployment configuration
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          for name in RELEASE_SHA GCP_PROJECT_ID GCP_ZONE GCP_INSTANCE GCP_ARTIFACT_REPOSITORY GCP_MIGRATION_SECRET GCP_WIF_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            test -n "${!name}" || { echo "Missing production variable: $name"; exit 1; }
          done
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GCP_ARTIFACT_REPOSITORY" =~ ^[a-z0-9-]+-docker\.pkg\.dev/[a-z0-9-]+/[a-z0-9_-]+$ ]]
          [[ "$GCP_INSTANCE" =~ ^[a-z][a-z0-9-]*$ ]]
          [[ "$GCP_ZONE" =~ ^[a-z0-9-]+$ ]]
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: google-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 593.0.0
      - name: Configure Artifact Registry credentials
        run: gcloud auth configure-docker "${GCP_ARTIFACT_REPOSITORY%%/*}" --quiet
      - name: Protect the live release from registry cleanup
        run: python3 deploy/pin_release_images.py current
      - name: Publish the exact CI images with their provenance and SBOM
        env:
          REGISTRY_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: bash deploy/oci-images.sh publish "$RUNNER_TEMP/release-images" "$RELEASE_SHA" "$GCP_ARTIFACT_REPOSITORY"
      - name: Scan backend; block every high or critical vulnerability
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.BACKEND_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          cache: false
      - name: Scan web; block every high or critical vulnerability
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.WEB_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          cache: false
      - name: Scan the exact gateway, PostgreSQL and public support images
        run: bash deploy/scan-support.sh "$GATEWAY_IMAGE" "$POSTGRES_IMAGE"
      - name: Smoke test the exact published images
        run: bash deploy/smoke.sh "$BACKEND_IMAGE" "$WEB_IMAGE" "$GATEWAY_IMAGE" "$POSTGRES_IMAGE"
      - name: Refuse a superseded release before changing production
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (data.commit.sha !== process.env.RELEASE_SHA) throw new Error('Main advanced; release the new passing CI commit');
      - name: Transfer the verified release and deploy through IAP
        run: |
          set -euo pipefail
          umask 077
          stage="/run/pyracast-release-$RELEASE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          local_stage="$(mktemp -d)"
          cleanup() {
            rm -f "$local_stage/migration.json" "$local_stage/release.tar.gz"
            rmdir "$local_stage"
            gcloud compute ssh "$GCP_INSTANCE" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
              --tunnel-through-iap --ssh-key-expire-after=1h --quiet --command="sudo rm -rf -- '$stage'" || true
          }
          trap cleanup EXIT
          git archive --format=tar.gz --output="$local_stage/release.tar.gz" "$RELEASE_SHA" deploy
          gcloud secrets versions access latest --secret="$GCP_MIGRATION_SECRET" \
            --project="$GCP_PROJECT_ID" --out-file="$local_stage/migration.json"
          gcloud compute ssh "$GCP_INSTANCE" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after=1h --quiet --command="umask 077; sudo install -d -m 0700 -o \"\$(id -u)\" -g \"\$(id -g)\" '$stage' && mkdir '$stage/bundle'"
          gcloud compute scp "$local_stage/release.tar.gz" "$local_stage/migration.json" "$GCP_INSTANCE:$stage/" \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=1h --quiet
          gcloud compute ssh "$GCP_INSTANCE" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after=1h --quiet \
            --command="tar -xzf '$stage/release.tar.gz' -C '$stage/bundle' && sudo bash '$stage/bundle/deploy/install-release.sh' '$RELEASE_SHA' '$BACKEND_IMAGE' '$WEB_IMAGE' '$GATEWAY_IMAGE' '$POSTGRES_IMAGE' '$stage/bundle' '$stage/migration.json'"
      - name: Protect the verified deployed digests from registry cleanup
        run: python3 deploy/pin_release_images.py published
      - name: Record the deployed digests
        run: |
          printf 'Released %s\n\nBackend: %s\n\nWeb: %s\n\nGateway: %s\n\nPostgreSQL: %s\n' "$RELEASE_SHA" "$BACKEND_IMAGE" "$WEB_IMAGE" "$GATEWAY_IMAGE" "$POSTGRES_IMAGE" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: [authorize, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Remove the transferred image artifact after successful deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ needs.authorize.outputs.artifact_id }}
        with:
          script: |
            await github.rest.actions.deleteArtifact({
              ...context.repo, artifact_id: Number(process.env.ARTIFACT_ID),
            });
