name: Dependency audit

on:
  schedule:
    - cron: '47 4 * * *'

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.10
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - id: sync
        run: uv sync --locked --no-build
      - run: uv export --locked --all-groups --all-extras --no-emit-project --no-hashes --output-file audit-requirements.txt
      - run: uv run --locked --no-sync --no-build pip-audit --strict --no-deps --disable-pip --requirement audit-requirements.txt
      - name: Audit web dependencies against dated exceptions
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --locked --no-sync --no-build python scripts/npm_audit.py web
