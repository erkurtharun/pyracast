version: 2
# Every merged update releases to production, so version updates wait out a cooldown;
# security updates are not delayed by it.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Istanbul
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      development:
        dependency-type: development
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # The build backend follows the uv release pinned in CI and the image.
      - dependency-name: uv-build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Istanbul
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/, /web, /deploy/gateway, /deploy/postgres]
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Istanbul
    cooldown:
      default-days: 5
    ignore:
      # Runtime minor/major upgrades require a coordinated compatibility review.
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Istanbul
    cooldown:
      default-days: 5
  - package-ecosystem: gomod
    directory: /deploy/gateway
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Istanbul
    cooldown:
      default-days: 5
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Istanbul
    cooldown:
      default-days: 5
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Istanbul
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      development:
        dependency-type: development
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Upgrade with the OpenAPI generator when its TypeScript peer range permits it.
      - dependency-name: typescript
        versions: ['>=6']
