sonar.host.url=https://sonarcloud.io
sonar.projectName=Pyracast
sonar.sourceEncoding=UTF-8
sonar.sources=src,scripts,.agents/hooks.py,.github,web/src,web/testing
sonar.tests=tests,web/tests,web/integration
sonar.exclusions=web/src/lib/schema.d.ts
sonar.coverage.exclusions=scripts/**,.agents/hooks.py,.github/**,web/testing/**
sonar.python.version=3.15
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
