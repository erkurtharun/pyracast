[project]
name = "pyracast"
version = "0.1.0"
description = "Multi-tenant irradiance forecasting backend"
readme = "README.md"
requires-python = "==3.15.2"
dependencies = [
    "argon2-cffi>=25.1.0",
    "astral==3.2",
    "cryptography==50.0.2",
    "django>=6.1.3",
    "django-allauth[headless,mfa]==65.22.1",
    "djangorestframework>=3.18.3",
    "dramatiq[rabbitmq]>=2.2.1",
    "drf-spectacular>=0.30.0",
    "httpx>=0.28.1",
    "gunicorn==27.0.0; sys_platform != 'win32'",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "django-stubs-ext>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "hypothesis>=6.170.15",
    "mypy",
    "pika>=1.4.4",
    "pip-audit",
    "psutil>=7.2.2",
    "pytest",
    "pytest-cov",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "ruff",
    "types-psutil>=7.2.2.20261111",
]

[project.scripts]
pyracast = "pyracast.cli:main"

[project.optional-dependencies]
scientific = ["pvlib>=0.16.1"]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.uv]
prerelease = "disallow"
no-build = true
no-binary-package = ["h5py", "pyyaml"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "PT", "RUF", "N", "ERA"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts", "deploy", ".codex/hooks"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "pyracast.settings"

[[tool.mypy.overrides]]
module = ["dramatiq.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["allauth.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-config --strict-markers -ra --cov --cov-report=term-missing --cov-report=xml"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/pyracast"]

[tool.coverage.report]
fail_under = 100
show_missing = true
