[project]
name = "pyracast"
version = "0.1.0"
description = "Multi-tenant irradiance forecasting backend"
readme = "README.md"
requires-python = "==3.15.2"
dependencies = [
    "argon2-cffi>=25.1.0",
    "astral==3.2",
    "cryptography==50.0.2",
    "django>=6.1.3",
    "django-allauth[headless,mfa,socialaccount]==65.22.1",
    "djangorestframework>=3.18.3",
    "dramatiq[rabbitmq]>=2.2.1",
    "drf-spectacular>=0.30.0",
    "httpx>=0.28.1",
    "gunicorn==27.0.1; sys_platform != 'win32'",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "segno==1.6.6",
    "tzdata>=2026.6",
    "whitenoise==6.12.0",
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "django-stubs-ext>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "hypothesis>=6.170.15",
    "pika>=1.4.4",
    "pip-audit",
    "polib==1.2.0",
    "psutil>=7.2.2",
    "pytest",
    "pytest-cov",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff",
    "types-openpyxl==3.1.5.20261017",
    "types-polib>=1.2.0.20260518",
    "types-psutil>=7.2.2.20261111",
    "types-pyyaml>=6.0.12.20261103",
]

[project.scripts]
pyracast = "pyracast.cli:main"

[project.optional-dependencies]
scientific = ["pvlib>=0.16.1"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
prerelease = "disallow"
no-build = true
no-binary-package = ["h5py", "pyyaml"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.per-file-target-version]
"deploy/backup.py" = "py312"
"deploy/bootstrap_database.py" = "py312"
"deploy/host.py" = "py312"
"deploy/operations_log.py" = "py312"
"deploy/pin_release_images.py" = "py312"
"deploy/probe_origin.py" = "py312"
"deploy/probe_origin_pull.py" = "py312"
"deploy/rehearsal.py" = "py312"
"deploy/release_authorization.py" = "py312"
"deploy/release_environment.py" = "py312"
"deploy/release_record.py" = "py312"
"deploy/release_scope.py" = "py312"
"deploy/release_state.py" = "py312"
"deploy/release_unit.py" = "py312"
"deploy/reset_database.py" = "py312"
"deploy/runtime_secrets.py" = "py312"
"deploy/watchdog.py" = "py312"
"scripts/ci_result.py" = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "PT", "RUF", "N", "ERA"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts", "deploy", ".agents/hooks.py"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "pyracast.settings"

[[tool.mypy.overrides]]
module = ["allauth.*"]
follow_untyped_imports = true

[tool.pytest]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
strict = true
addopts = [
    "-q",
    "--tb=short",
    "-ra",
    "--liveserver=127.0.0.1",
    "-m",
    "not browser",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
filterwarnings = ["error"]
markers = [
    "tooling: tests of repository tooling, agents, CI and deployment scripts",
    "subprocess: tests that start processes",
    "migration: tests that migrate the database to an earlier state",
    "browser: tests that drive a browser",
    "live: tests that need a live broker or provider",
]
faulthandler_timeout = 300

[tool.coverage.run]
branch = true
relative_files = true
source = ["src", "deploy"]

[tool.coverage.report]
fail_under = 100
show_missing = true
